[project]
name = "quant-journey"
version = "0.1.0"
description = "Full-stack quant journey: data → features → forecasting models → backtesting → live systems → ML infra → LLM architecture"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "requests>=2.32",
    "websockets>=13.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
]
llm = [
    "torch>=2.14.0",
]

[project.scripts]
qj = "qj.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qj"]
